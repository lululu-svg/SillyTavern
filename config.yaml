# SillyTavern配置文件

# 安全设置
security:
  # 禁用IP白名单检查（云部署必须）
  ip_whitelist:
    enabled: false
  # 或者更宽松的设置（只允许本地回环地址）
  # allowed_hosts:
  #   - "localhost"
  #   - "127.0.0.1"

# API设置
api:
  # 允许用户自定义API密钥（最关键！）
  api_key_input: true

# 服务器设置
server:
  # 设置信任代理（Railway需要）
  trust_proxy: true
  # 允许所有主机（云部署）
  allowed_hosts: ["*"]
